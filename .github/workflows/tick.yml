name: Advance Economy Town

on:
  schedule:
    # Every 30 minutes, offset from :00/:30 so it doesn't pile up with everyone
    # else's cron jobs (GitHub throttles exact-hour schedules under load).
    - cron: "7,37 * * * *"
  workflow_dispatch: {}  # lets you trigger a phase manually from the Actions tab

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Advance the town by one time-of-day phase
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 main.py --rounds 1

      - name: Commit the town's new state
        run: |
          git config user.name "economy-town-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f economy.db town_state.json
          git diff --cached --quiet || git commit -m "Advance town by one phase [skip ci]"
          git push
